<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142b40">
  <title>Offline — The Interactive C++ Book</title>
  <style>
    :root{color-scheme:light dark;--navy:#142b40;--mint:#b9d6c4;--paper:#f4f6f5;--ink:#182a38;--muted:#526574}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,sans-serif}
    main{width:min(100%,620px);padding:clamp(24px,6vw,48px);border-radius:8px;background:var(--navy);color:#f4f6f5}
    .brand{color:var(--mint);font:11px ui-monospace,monospace;letter-spacing:.12em}h1{margin:36px 0 12px;font-size:clamp(32px,7vw,48px);line-height:1.08}p{color:#d3dce2}a{display:inline-block;margin-top:12px;padding:10px 14px;border:1px solid var(--mint);border-radius:4px;color:var(--mint);font-weight:650;text-decoration:none}a:focus-visible{outline:3px solid #f0c875;outline-offset:3px}
    @media(prefers-color-scheme:dark){:root{--paper:#101b25;--ink:#e3e9ed;--muted:#aab8c2}}
  </style>
</head>
<body>
  <main>
    <div class="brand">[→] THE INTERACTIVE C++ BOOK</div>
    <h1>You’re offline.</h1>
    <p>This page has not been saved on this device yet. Pages you have already opened can still be read offline.</p>
    <a href="@@BOOK_HOME@@">Open the saved book home →</a>
  </main>
</body>
</html>
